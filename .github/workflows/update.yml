name: Update deals

on:
  schedule:
    - cron: "17 11 * * *"        # every day at 11:17 UTC (6:17 am US Eastern)
  workflow_dispatch:             # "Run workflow" button for an update right now

permissions:
  contents: write

concurrency:
  group: update-deals
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect deals
        run: python deals.py
      - name: Save results
        run: |
          git config user.name "deals-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/deals.json
          git diff --cached --quiet || (git commit -m "Update deals" && git pull --rebase -q && git push)
